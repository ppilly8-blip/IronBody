name: Build Android APK

# Runs by itself after every upload to the main branch,
# or by hand: Actions tab -> "Build Android APK" -> Run workflow.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# A newer upload replaces a build that is still running.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to publish the APK on the Releases page

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The build machine already has the Android tools. This only accepts the licences and makes
      # sure the exact parts this app is built with (Android API 36) are installed.
      - name: Install the Android SDK parts
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the tools listed in package.json
        run: npm ci

      - name: Create the Android project (icons, launch screen, web app)
        run: node scripts/prepare-android.js
        env:
          IRONBODY_BUILD_NUMBER: ${{ github.run_number }}

      # The APK is signed with the fixed key in keystore/ (set up by scripts/prepare-android.js).
      # Same key every time = a new APK installs over the old one and your saved data stays.
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IronBody.apk

      # Safety net: stop here if the APK is not signed with the fixed key.
      - name: Check the APK is signed with the fixed key
        run: |
          APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | sort -V | tail -1)
          WANT=$(keytool -list -v -keystore keystore/debug.keystore -storepass android 2>/dev/null | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f')
          GOT=$("$APKSIGNER" verify --print-certs IronBody.apk | grep 'certificate SHA-256 digest' | head -1 | sed 's/.*: *//' | tr 'A-F' 'a-f')
          echo "fixed key : $WANT"
          echo "apk signed: $GOT"
          test -n "$WANT" && test "$WANT" = "$GOT"

      - uses: actions/upload-artifact@v4
        with:
          name: IronBody-apk
          path: IronBody.apk
          if-no-files-found: error

      # Puts IronBody.apk on the Releases page, so it can be downloaded straight to a phone.
      # The link  https://github.com/<you>/<repo>/releases/latest/download/IronBody.apk
      # always points to the newest build.
      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: IronBody build ${{ github.run_number }}
          body: |
            Download **IronBody.apk** below and open it on your Android phone.
            (First time only: Android asks to allow installs from this source - say yes.)
          files: IronBody.apk
          make_latest: true
